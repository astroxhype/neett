  const MASTERY_STATES = [
    { key: 'not-started', label: 'Not started', value: 0 },
    { key: 'learning', label: 'Learning', value: 25 },
    { key: 'revised', label: 'Revised', value: 50 },
    { key: 'pyq-done', label: 'PYQ done', value: 75 },
    { key: 'mastered', label: 'Mastered', value: 100 }
  ];
  let examTick = null;
  let examStartedAt = 0;
  let paletteReady = false;

  function storageKey(id, area) {
    return `study-map:chapter:${id}:${area}`;
  }

  function readStore(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value ? JSON.parse(value) : fallback;
    } catch {
      return fallback;
    }
  }

  function writeStore(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch {
      return false;
    }
  }

  function getMastery(id) {
    try {
      return localStorage.getItem(storageKey(id, 'mastery')) || 'not-started';
    } catch {
      return 'not-started';
    }
  }

  function setMastery(id, value) {
    try {
      localStorage.setItem(storageKey(id, 'mastery'), value);
    } catch {
      return false;
    }
    return true;
  }

  function masteryValue(id) {
    const state = MASTERY_STATES.find(item => item.key === getMastery(id)) || MASTERY_STATES[0];
    return state.value;
  }

  function revisionQueue() {
    return readStore('study-map:revision-queue', []);
  }

  function isQueued(id) {
    return revisionQueue().includes(id);
  }

  function toggleQueue(id) {
    const queue = revisionQueue();
    const next = queue.includes(id) ? queue.filter(item => item !== id) : [...queue, id];
    writeStore('study-map:revision-queue', next);
    return next.includes(id);
  }

  function chapterMistakes(id) {
    return readStore(storageKey(id, 'mistakes'), []);
  }

  function chapterDrills(id) {
    return readStore(storageKey(id, 'drills'), {});
  }

  function normalizeLabel(value) {
    return String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }

  function chapterFromLabel(label) {
    const needle = normalizeLabel(label);
    if (!needle || needle === 'none') return null;
    return allChapters.find(chapter => normalizeLabel(chapter.title) === needle)
      || allChapters.find(chapter => normalizeLabel(chapter.title).includes(needle))
      || allChapters.find(chapter => needle.includes(normalizeLabel(chapter.title)));
  }

  function progressComplete(chapter) {
    const mastery = getMastery(chapter.id);
    if (['revised', 'pyq-done', 'mastered'].includes(mastery)) return true;
    try {
      return localStorage.getItem(`study-map:${chapter.subject}:${chapter.id}:Revised`) === 'true'
        || localStorage.getItem(`study-map:${chapter.subject}:${chapter.id}:PYQs done`) === 'true'
        || localStorage.getItem(`study-map:${chapter.subject}:${chapter.id}:Mistakes fixed`) === 'true';
    } catch {
      return false;
    }
  }

  function missingDependencies(chapter) {
    return (chapter.before || [])
      .map(label => ({ label, chapter: chapterFromLabel(label) }))
      .filter(item => item.label !== 'None' && item.chapter && !progressComplete(item.chapter));
  }

  function topicExtraHTML(chapter, topic) {
    const query = `${chapter.title} ${topic.title} ${chapter.subjectLabel} NEET`;
    const drill = topic.subs[0] || topic.title;
    const traps = [chapter.warning, `Re-check ${topic.title} examples`, `Do not skip ${drill}`].filter(Boolean);
    return `
      <div class="topic-extra">
        <div class="topic-extra-row"><b>NCERT line target</b>${topic.subs.slice(0, 3).join(' / ')}</div>
        <div class="topic-extra-row"><b>NEET trap</b>${traps.slice(0, 2).join(' / ')}</div>
        <div class="topic-extra-row"><b>Diagram drill</b>Draw or map: ${topic.title} → ${drill}</div>
        <div class="topic-extra-row"><b>Video lane</b><a href="${youtubeSearchUrl(query)}" target="_blank" rel="noopener">Open topic videos</a></div>
      </div>
    `;
  }

  function diagramPrompts(chapter, topics) {
    const prompts = [
      `Draw ${chapter.title} one-page concept map`,
      ...(chapter.ncert || []).map(item => `Map ${item}`),
      ...(chapter.role || []).map(item => `Explain ${item} as a flow`),
      ...topics.map(topic => `Label or flowchart ${topic.title}`)
    ];
    return [...new Set(prompts)].slice(0, 8);
  }

  function mistakeRows(id) {
    const mistakes = chapterMistakes(id);
    if (!mistakes.length) return '<div class="mistake-item"><span>No mistakes logged yet.</span></div>';
    return mistakes.map((item, index) => `
      <div class="mistake-item">
        <span>${item.text}</span>
        <button type="button" data-remove-mistake="${index}">Fix</button>
      </div>
    `).join('');
  }

  function buildChapterTools(chapter, topics) {
    const mastery = getMastery(chapter.id);
    const missing = missingDependencies(chapter);
    const dependencyHTML = missing.length ? `
      <article class="dependency-alert">
        <h3>Foundation warning</h3>
        <p>You opened this before clearing <strong>${missing.map(item => item.chapter.title).join(', ')}</strong>. Revise those first if this chapter feels heavy.</p>
      </article>
    ` : '';

    return `
      <section class="chapter-tools" id="tools">
        <div class="tool-grid">
          ${dependencyHTML}
          <article class="tool-card">
            <h3>Mastery meter</h3>
            <div class="mastery-meter" style="--mastery:${masteryValue(chapter.id)}%"><span></span></div>
            <div class="mastery-steps">
              ${MASTERY_STATES.map(state => `<button type="button" data-mastery="${state.key}" aria-pressed="${state.key === mastery}">${state.label}</button>`).join('')}
            </div>
          </article>
          <article class="tool-card">
            <h3>Study controls</h3>
            <div class="tool-actions">
              <button type="button" id="queueToggle" aria-pressed="${isQueued(chapter.id)}">${isQueued(chapter.id) ? 'Remove from revision queue' : 'Add to revision queue'}</button>
              <button type="button" onclick="toggleExamMode(true)">Exam mode</button>
              <button type="button" onclick="openCommandPalette()">Search / command</button>
            </div>
          </article>
          <article class="tool-card">
            <h3>Quick mission</h3>
            <p>Open one topic, complete one diagram drill, log one mistake, then finish one PYQ lane from the video vault.</p>
          </article>
        </div>
      </section>
    `;
  }

  function buildStudyLab(chapter, topics) {
    const drills = chapterDrills(chapter.id);
    return `
      <section class="study-lab" id="studyLab">
        <div class="study-grid">
          <article class="study-card">
            <h3>Diagram drill mode</h3>
            <div class="drill-list">
              ${diagramPrompts(chapter, topics).map(prompt => `<button class="drill-item" type="button" data-drill="${prompt}" aria-pressed="${Boolean(drills[prompt])}">${prompt}</button>`).join('')}
            </div>
          </article>
          <article class="study-card">
            <h3>Mistake log</h3>
            <textarea class="mistake-input" id="mistakeInput" placeholder="Write the exact error you made in this chapter..."></textarea>
            <div class="tool-actions"><button type="button" id="mistakeAdd">Log mistake</button></div>
            <div class="mistake-list" id="mistakeList">${mistakeRows(chapter.id)}</div>
          </article>
        </div>
      </section>
    `;
  }

  function updateMasteryUI(chapter) {
    const value = masteryValue(chapter.id);
    const meter = document.querySelector('.mastery-meter');
    if (meter) meter.style.setProperty('--mastery', `${value}%`);
    document.querySelectorAll('[data-mastery]').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.mastery === getMastery(chapter.id)));
    });
  }

  function renderMistakeList(chapter) {
    const list = document.getElementById('mistakeList');
    if (list) list.innerHTML = mistakeRows(chapter.id);
  }

  function bindChapterTools(chapter, topics) {
    document.querySelectorAll('[data-mastery]').forEach(button => {
      button.addEventListener('click', () => {
        setMastery(chapter.id, button.dataset.mastery);
        updateMasteryUI(chapter);
      });
    });

    const queueButton = document.getElementById('queueToggle');
    if (queueButton) {
      queueButton.addEventListener('click', () => {
        const active = toggleQueue(chapter.id);
        queueButton.setAttribute('aria-pressed', String(active));
        queueButton.textContent = active ? 'Remove from revision queue' : 'Add to revision queue';
      });
    }

    const mistakeInput = document.getElementById('mistakeInput');
    const mistakeAdd = document.getElementById('mistakeAdd');
    if (mistakeInput && mistakeAdd) {
      mistakeAdd.addEventListener('click', () => {
        const text = mistakeInput.value.trim();
        if (!text) return;
        writeStore(storageKey(chapter.id, 'mistakes'), [{ text, time: Date.now() }, ...chapterMistakes(chapter.id)]);
        mistakeInput.value = '';
        renderMistakeList(chapter);
      });
      document.getElementById('mistakeList').addEventListener('click', event => {
        const button = event.target.closest('[data-remove-mistake]');
        if (!button) return;
        const next = chapterMistakes(chapter.id).filter((_, index) => index !== Number(button.dataset.removeMistake));
        writeStore(storageKey(chapter.id, 'mistakes'), next);
        renderMistakeList(chapter);
      });
    }

    document.querySelectorAll('[data-drill]').forEach(button => {
      button.addEventListener('click', () => {
        const drills = chapterDrills(chapter.id);
        drills[button.dataset.drill] = !drills[button.dataset.drill];
        writeStore(storageKey(chapter.id, 'drills'), drills);
        button.setAttribute('aria-pressed', String(Boolean(drills[button.dataset.drill])));
      });
    });

    document.querySelectorAll('.topic-card').forEach(card => {
      card.addEventListener('click', event => {
        if (event.target.closest('a')) return;
        card.classList.toggle('is-expanded');
      });
      card.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        card.classList.toggle('is-expanded');
      });
    });
  }

  function toggleExamMode(force) {
    const shouldOpen = force === undefined ? !app.classList.contains('exam-mode') : force;
    app.classList.toggle('exam-mode', shouldOpen);
    if (shouldOpen) {
      examStartedAt = Date.now();
      if (examTick) clearInterval(examTick);
      examTick = setInterval(updateExamTimer, 1000);
      updateExamTimer();
      document.querySelector('.recall-section').scrollIntoView({ behavior: 'smooth' });
    } else if (examTick) {
      clearInterval(examTick);
      examTick = null;
    }
  }

  function updateExamTimer() {
    const timer = document.getElementById('examTimer');
    if (!timer) return;
    const seconds = Math.floor((Date.now() - examStartedAt) / 1000);
    const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
    const secs = String(seconds % 60).padStart(2, '0');
    timer.textContent = `${mins}:${secs}`;
  }

  function openCommandPalette() {
    const palette = document.getElementById('commandPalette');
    const input = document.getElementById('paletteInput');
    if (!palette || !input) return;
    palette.classList.add('is-open');
    input.value = '';
    input.dispatchEvent(new Event('input'));
    setTimeout(() => input.focus(), 0);
  }

  function closeCommandPalette() {
    const palette = document.getElementById('commandPalette');
    if (palette) palette.classList.remove('is-open');
  }

  function initCommandPalette(chapter, topics) {
    const palette = document.getElementById('commandPalette');
    const input = document.getElementById('paletteInput');
    const results = document.getElementById('paletteResults');
    if (!palette || !input || !results) return;
    const entries = [
      ...allChapters.map(item => ({ type: item.subjectCode, label: item.title, sub: item.code, action: 'chapter', target: item.id })),
      ...topics.map((topic, index) => ({ type: 'TOPIC', label: topic.title, sub: chapter.title, action: 'topic', target: index })),
      { type: 'VIDEO', label: 'Open chapter video vault', sub: chapter.title, action: 'section', target: 'videos' },
      { type: 'TOOLS', label: 'Open study controls', sub: 'Mastery / Queue / Exam', action: 'section', target: 'tools' },
      { type: 'LAB', label: 'Open mistake log and drills', sub: 'Diagram drill / Mistakes', action: 'section', target: 'studyLab' }
    ];

    function renderPalette() {
      const query = normalizeLabel(input.value);
      const visible = entries
        .filter(item => !query || normalizeLabel(`${item.type} ${item.label} ${item.sub}`).includes(query))
        .slice(0, 14);
      results.innerHTML = visible.map((item, index) => `
        <button class="palette-result" type="button" data-palette-index="${index}">
          <span>${item.type}</span>
          <strong>${item.label}<br><small>${item.sub}</small></strong>
        </button>
      `).join('');
      results.querySelectorAll('[data-palette-index]').forEach((button, index) => {
        button.addEventListener('click', () => runPaletteEntry(visible[index]));
      });
    }

    function runPaletteEntry(entry) {
      if (!entry) return;
      closeCommandPalette();
      if (entry.action === 'chapter') goTo(entry.target);
      if (entry.action === 'topic') {
        const card = document.querySelector(`.topic-card[data-index="${entry.target}"]`);
        if (card) {
          card.classList.add('is-expanded');
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
      if (entry.action === 'section') {
        const section = document.getElementById(entry.target);
        if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    input.addEventListener('input', renderPalette);
    palette.addEventListener('click', event => {
      if (event.target === palette) closeCommandPalette();
    });
    renderPalette();

    if (!paletteReady) {
      paletteReady = true;
      document.addEventListener('keydown', event => {
        const target = event.target;
        const typing = target && ['INPUT', 'TEXTAREA'].includes(target.tagName);
        if (event.key === 'Escape') closeCommandPalette();
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
          event.preventDefault();
          openCommandPalette();
        } else if (!typing && event.key === '/') {
          event.preventDefault();
          openCommandPalette();
        }
      });
    }
  }

  function sectionStrip(label, variant = '') {
    const stripText = Array.from({ length: 8 }, () => `<span>${label}</span>`).join('');
    return `<div class="section-strip ${variant}" aria-hidden="true"><div class="section-strip-track">${stripText}</div></div>`;
  }

  function renderChapter(id) {
    const chapter = allChapters.find(c => c.id === id);
    if (!chapter) {
      document.getElementById('chLoader').remove();
      app.innerHTML = `<div class="not-found"><h1>Chapter not found</h1><p>The chapter ID "${id || '(none)'}" does not match any mapped chapter.</p><a href="index.html">Back to Map</a></div>`;
      app.style.opacity = '1';
      return;
    }

    currentSubjectKey = chapter.subject || 'biology';
    const subjectDeck = subjectDecks[currentSubjectKey] || subjectDecks.biology;
    const subjectChapters = deckChapters(subjectDeck);
    const idx = subjectChapters.findIndex(item => item.id === chapter.id);

    // Initialize loader
    buildLoader(chapter, idx);

    const topics = (chapter.deckTopics && chapter.deckTopics[id]) || [];
    const totalSubs = topics.reduce((s, t) => s + t.subs.length, 0);
    const prev = idx > 0 ? subjectChapters[idx - 1] : null;
    const next = idx < subjectChapters.length - 1 ? subjectChapters[idx + 1] : null;
    const chapterNumber = chapter.code.split('-').pop() || String(idx + 1).padStart(2, '0');
    const chapterMark = KANJI_MAP[chapter.id] || SUBJECT_MARKS[chapter.subject] || '章';
    const videoSection = buildVideoSection(chapter, topics);
    const dependencyStrip = sectionStrip('依存 / dependency ledger / prerequisite map', 'section-strip--ink');
    const focusStrip = sectionStrip('要点 / ncert focus / high yield frame');
    const topicStrip = sectionStrip('学習 / topic map / chapter interior', 'section-strip--red');
    const recallStrip = sectionStrip('記憶 / active recall / self test');
    const videoStrip = sectionStrip('映像 / video vault / youtube lanes', 'section-strip--ink');
    const toolsStrip = sectionStrip('制御 / mastery / queue / command', 'section-strip--red');
    const labStrip = sectionStrip('鍛錬 / mistake log / diagram drills');
    const toolsSection = buildChapterTools(chapter, topics);
    const studyLab = buildStudyLab(chapter, topics);

    document.title = `${chapter.title} - ${chapter.subjectLabel} Chapter Map`;

    app.innerHTML = `
      <nav class="chapter-nav">
        <button class="back-btn" onclick="goBack()">Back to Map</button>
        <span class="nav-code">${chapter.subjectLabel} / ${chapter.code} / Floor ${chapter.floor} / ${chapter.floorName}</span>
      </nav>

      <div class="exam-hud">
        <strong>Exam mode armed</strong>
        <span id="examTimer">00:00</span>
        <button type="button" onclick="toggleExamMode(false)">Exit</button>
      </div>

      <section class="chapter-hero">
        <div class="hero-main">
          <div class="chapter-kanji-mark" aria-hidden="true">${chapterMark}</div>
          <div class="chapter-vertical-mark" aria-hidden="true">第${chapterNumber}章</div>
          <div class="hero-code">${chapter.code} &mdash; Class ${chapter.class} &mdash; Floor ${chapter.floor}</div>
          <h1 class="chapter-title">${chapter.title}</h1>
          <p class="chapter-desc">${chapter.note} This ${chapter.subjectLabel} chapter sits on <strong>${chapter.floorName}</strong>. Revise it with its prerequisite chapters instead of treating it as an isolated lesson.</p>
          ${chapter.warning ? `<span class="chapter-warning">${chapter.warning}</span>` : ''}
        </div>
        <aside class="hero-side">
          <div class="meta-cell" style="animation-delay:2040ms"><b>${chapter.class}</b><span>Class</span></div>
          <div class="meta-cell" style="animation-delay:2110ms"><b>${chapter.yield}</b><span>NEET Yield</span></div>
          <div class="meta-cell" style="animation-delay:2180ms"><b>${chapter.difficulty}</b><span>Difficulty</span></div>
          <div class="meta-cell" style="animation-delay:2250ms"><b>${chapter.pyq}</b><span>PYQ Heat</span></div>
          <div class="meta-cell" style="animation-delay:2320ms"><b>${chapter.type}</b><span>Nature</span></div>
          <div class="meta-cell" style="animation-delay:2390ms"><b>${chapter.floor}</b><span>Floor</span></div>
        </aside>
      </section>

      ${dependencyStrip}

      <section class="deps-section">
        <h3 class="deps-title">Dependencies</h3>
        <div class="deps-grid">
          <div class="dep-row" style="animation-delay:2520ms">
            <strong>Before</strong>
            <div class="dep-chips">${chapter.before.map((b, i) => `<span class="dep-chip" style="animation-delay:${2620 + i * 60}ms">${b}</span>`).join('')}</div>
          </div>
          <div class="dep-row" style="animation-delay:2600ms">
            <strong>If Stuck</strong>
            <div class="dep-chips">${chapter.stuck.map((s, i) => `<span class="dep-chip" style="animation-delay:${2700 + i * 60}ms">${s}</span>`).join('')}</div>
          </div>
          <div class="dep-row" style="animation-delay:2680ms">
            <strong>Unlocks</strong>
            <div class="dep-chips">${chapter.after.map((a, i) => `<span class="dep-chip" style="animation-delay:${2780 + i * 60}ms">${a}</span>`).join('')}</div>
          </div>
          <div class="dep-row" style="animation-delay:2760ms">
            <strong>Exam Role</strong>
            <div class="dep-chips">${chapter.role.map((r, i) => `<span class="dep-chip" style="animation-delay:${2860 + i * 60}ms">${r}</span>`).join('')}</div>
          </div>
        </div>
      </section>

      ${toolsStrip}

      ${toolsSection}

      ${focusStrip}

      <div class="focus-strip">
        ${chapter.ncert.map((f, i) => `<div class="focus-cell" style="animation-delay:${3000 + i * 80}ms">${f}</div>`).join('')}
      </div>

      ${topicStrip}

      <section class="topics-section">
        <div class="topics-header">
          <h2>Inside <span class="serif">this</span> chapter</h2>
          <div class="topics-counter"><b>${totalSubs}</b> subtopics across ${topics.length} topics</div>
        </div>
        <div class="topics-grid">
          ${topics.map((topic, ti) => `
            <article class="topic-card" data-index="${ti}" tabindex="0" style="--card-delay:${ti * 100}ms">
              <div class="topic-head">
                <b>${String(ti + 1).padStart(2, '0')}</b>
                <span>${topic.title}</span>
              </div>
              <ul class="topic-subs">
                ${topic.subs.map((sub, si) => `<li style="animation-delay:${(ti * 120) + (si * 55) + 180}ms">${sub}</li>`).join('')}
              </ul>
              ${topicExtraHTML(chapter, topic)}
            </article>
          `).join('')}
        </div>
      </section>

      ${recallStrip}

      <section class="recall-section">
        <h3>Recall checks</h3>
        <div class="recall-grid">
          ${chapter.recall.map((r, i) => `<div class="recall-item" data-index="${i}" style="--item-delay:${i * 120}ms">${r}</div>`).join('')}
        </div>
      </section>

      ${labStrip}

      ${studyLab}

      ${videoStrip}

      ${videoSection}

      <nav class="chapter-pager">
        ${prev ? `<button class="pager-link" onclick="goTo('${prev.id}')"><small>${prev.code} &mdash; Previous</small><strong>${prev.title}</strong></button>` : `<button class="pager-link" disabled><small>No previous</small><strong>&mdash;</strong></button>`}
        ${next ? `<button class="pager-link" onclick="goTo('${next.id}')"><small>${next.code} &mdash; Next</small><strong>${next.title}</strong></button>` : `<button class="pager-link" disabled><small>No next</small><strong>&mdash;</strong></button>`}
      </nav>

      <footer class="chapter-footer">
        <strong>${chapter.title}</strong>
        <button class="footer-back" onclick="goBack()">Back to Map</button>
      </footer>

      <div class="command-palette" id="commandPalette" role="dialog" aria-modal="true">
        <div class="palette-box">
          <input id="paletteInput" type="search" placeholder="Search chapters, topics, tools..." autocomplete="off">
          <div class="palette-results" id="paletteResults"></div>
        </div>
      </div>
      <div class="chapter-transition" id="chapterTransition">${chapterNumber}</div>
    `;

    // scroll-triggered animations
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

    document.querySelectorAll('.topic-card, .recall-item, .video-card, .tool-card, .study-card, .dependency-alert').forEach(el => observer.observe(el));
    bindChapterTools(chapter, topics);
    initCommandPalette(chapter, topics);
  }

  (function initChapterPointerLight() {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fine = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
    if (reduce || !fine) return;
    let raf = 0;
    window.addEventListener('pointermove', event => {
      if (raf) return;
      raf = window.requestAnimationFrame(() => {
        document.body.style.setProperty('--mx', event.clientX + 'px');
        document.body.style.setProperty('--my', event.clientY + 'px');
        raf = 0;
      });
    }, { passive: true });
  })();

  renderChapter(chapterId);
</script>
</body>
</html>
