<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter Explorer - NEET Foundation Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2eadb;
    --paper-2: #e5dac3;
    --ink: #11100d;
    --muted: #776e5e;
    --line: #1d1a15;
    --line-soft: #c9bea7;
    --red: #e53119;
    --red-dark: #9d1b0d;
    --olive: #6c7c33;
    --blue: #243d8f;
    --gold: #c08b1c;
    --shadow: 8px 8px 0 var(--ink);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    --mx: 50vw;
    --my: 50vh;
    min-height: 100vh;
    color: var(--ink);
    background:
      linear-gradient(112deg, transparent 0 49.8%, rgba(229,49,25,0.085) 49.9% 50.18%, transparent 50.25% 100%) 0 0 / 260px 260px,
      linear-gradient(90deg, rgba(17,16,13,0.055) 1px, transparent 1px) 0 0 / 34px 34px,
      linear-gradient(rgba(17,16,13,0.055) 1px, transparent 1px) 0 0 / 34px 34px,
      var(--paper);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(17,16,13,0.16) 0.7px, transparent 0.7px);
    background-size: 5px 5px;
    opacity: 0.22;
    z-index: 50;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 49;
    pointer-events: none;
    background:
      radial-gradient(circle at var(--mx) var(--my), rgba(229,49,25,0.15), transparent min(34vw, 430px)),
      linear-gradient(112deg, transparent 0 46%, rgba(229,49,25,0.045) 46.1% 46.45%, transparent 46.55% 100%);
    mix-blend-mode: multiply;
    opacity: 0.7;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  /* ── CHAPTER LOADER: QUIET PAPER REVEAL ── */
  .ch-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background:
      radial-gradient(circle at 50% 48%, rgba(229,49,25,0.14), transparent 34%),
      linear-gradient(90deg, rgba(17,16,13,0.055) 1px, transparent 1px) 0 0 / 36px 36px,
      linear-gradient(rgba(17,16,13,0.055) 1px, transparent 1px) 0 0 / 36px 36px,
      var(--paper);
    overflow: hidden;
    isolation: isolate;
  }

  .ch-loader::before {
    content: '';
    position: absolute;
    inset: -18% -28%;
    z-index: 3;
    background:
      linear-gradient(112deg, transparent 0 42%, rgba(229,49,25,0.2) 42.1% 42.45%, transparent 42.55% 100%),
      linear-gradient(112deg, transparent 0 58%, rgba(17,16,13,0.18) 58.05% 58.18%, transparent 58.24% 100%);
    transform: translateX(-74%) skewX(-14deg);
    pointer-events: none;
    animation: loaderBladeDrift 2400ms cubic-bezier(.77,0,.18,1) 360ms both;
  }

  @keyframes loaderBladeDrift {
    0% { opacity: 0; transform: translateX(-74%) skewX(-14deg); }
    22% { opacity: 1; }
    100% { opacity: 0.34; transform: translateX(46%) skewX(-14deg); }
  }

  .ch-loader:empty::after {
    content: 'INITIALIZING CHAPTER';
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 2;
    color: var(--red-dark);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    transform: translate(-50%, -50%);
  }

  /* Immediate visible grid */
  .ch-loader .ldr-grid {
    position: absolute;
    inset: 0;
    z-index: 1;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 49px, rgba(17,16,13,0.07) 49px, rgba(17,16,13,0.07) 50px),
      repeating-linear-gradient(90deg, transparent, transparent 49px, rgba(17,16,13,0.07) 49px, rgba(17,16,13,0.07) 50px);
    animation: fadeIn 200ms ease forwards;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Giant watermark */
  .ch-loader .kanji-bg {
    position: absolute;
    font-size: clamp(14rem, 38vw, 32rem);
    line-height: 0.8;
    top: 50%;
    left: 50%;
    z-index: 2;
    color: rgba(229,49,25,0.075);
    transform: translate(-50%, -50%) scale(0.84);
    animation: kanjiBoom 700ms cubic-bezier(.16,1,.3,1) 50ms forwards;
  }

  @keyframes kanjiBoom {
    0% { transform: translate(-50%, -50%) scale(0.84); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  /* Vertical Japanese side text */
  .ch-loader .jp-col {
    position: absolute;
    writing-mode: vertical-rl;
    font-size: 0.72rem;
    letter-spacing: 0.4em;
    color: rgba(157,27,13,0.55);
    font-weight: 700;
    opacity: 0;
    z-index: 6;
  }

  .ch-loader .jp-col-left {
    left: 30px;
    top: 50%;
    transform: translateY(-50%);
    animation: jpSlideIn 500ms cubic-bezier(.2,.8,.2,1) 100ms forwards;
  }

  .ch-loader .jp-col-right {
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    animation: jpSlideIn 500ms cubic-bezier(.2,.8,.2,1) 200ms forwards;
  }

  @keyframes jpSlideIn {
    from { opacity: 0; transform: translateY(-50%) translateX(20px); }
    to { opacity: 0.38; transform: translateY(-50%) translateX(0); }
  }

  /* Corner brackets */
  .ch-loader .ldr-bracket {
    position: absolute;
    width: 38px;
    height: 38px;
    border: 2px solid var(--red);
    opacity: 0;
    z-index: 7;
    animation: bracketSnap 360ms cubic-bezier(.2,.8,.2,1) forwards;
  }

  .ch-loader .ldr-bracket--tl { top: 18px; left: 18px; border-right: 0; border-bottom: 0; animation-delay: 0ms; }
  .ch-loader .ldr-bracket--tr { top: 18px; right: 18px; border-left: 0; border-bottom: 0; animation-delay: 50ms; }
  .ch-loader .ldr-bracket--bl { bottom: 18px; left: 18px; border-right: 0; border-top: 0; animation-delay: 100ms; }
  .ch-loader .ldr-bracket--br { bottom: 18px; right: 18px; border-left: 0; border-top: 0; animation-delay: 150ms; }

  @keyframes bracketSnap {
    0% { opacity: 0; transform: scale(1.4); }
    70% { opacity: 0.72; transform: scale(0.94); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* Scan rails */
  .ch-loader .scan-rail {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: rgba(229,49,25,0.55);
    transform-origin: left;
    transform: scaleX(0);
    z-index: 5;
  }

  .ch-loader .scan-rail--top {
    top: 30%;
    animation: railDraw 600ms cubic-bezier(.77,0,.18,1) 150ms forwards;
  }

  .ch-loader .scan-rail--bot {
    top: 70%;
    animation: railDraw 600ms cubic-bezier(.77,0,.18,1) 250ms forwards;
  }

  @keyframes railDraw {
    0% { transform: scaleX(0); opacity: 0; }
    50% { transform: scaleX(1); opacity: 0.8; }
    100% { transform: scaleX(1); opacity: 0.3; }
  }

  /* Center content block */
  .ch-loader .ldr-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
    width: 86vw;
    max-width: 800px;
  }

  /* Chapter code */
  .ch-loader .ldr-code {
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 12px;
    opacity: 0;
    animation: codeFade 400ms ease 150ms forwards;
  }

  @keyframes codeFade {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Chapter number */
  .ch-loader .ldr-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(6rem, 18vw, 13rem);
    line-height: 0.75;
    position: relative;
    color: rgba(17,16,13,0.12);
    opacity: 0;
    animation: numSlam 540ms cubic-bezier(.16,1,.3,1) 160ms forwards;
  }

  .ch-loader .ldr-num::after {
    content: attr(data-n);
    position: absolute;
    inset: 0;
    color: var(--red);
    clip-path: inset(100% 0 0 0);
    animation: numRedFill 600ms cubic-bezier(.77,0,.18,1) 550ms forwards;
  }

  @keyframes numSlam {
    0% { opacity: 0; transform: translateY(18px) scale(1.24); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes numRedFill {
    from { clip-path: inset(100% 0 0 0); }
    to { clip-path: inset(0 0 0 0); }
  }

  /* Title — wipe reveal */
  .ch-loader .ldr-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.2rem, 5vw, 4.5rem);
    line-height: 0.88;
    color: var(--ink);
    margin-top: 10px;
    clip-path: inset(0 100% 0 0);
    animation: titleWipe 620ms cubic-bezier(.77,0,.18,1) 520ms forwards;
  }

  @keyframes titleWipe {
    to { clip-path: inset(0 0 0 0); }
  }

  /* Floor tag */
  .ch-loader .ldr-floor {
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 12px;
    opacity: 0;
    animation: codeFade 300ms ease 850ms forwards;
  }

  /* Quiet seal */
  .ch-loader .hanko {
    position: absolute;
    top: 50%;
    right: clamp(50px, 10vw, 140px);
    width: clamp(72px, 10vw, 108px);
    height: clamp(72px, 10vw, 108px);
    border: 2px solid var(--red);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(2.2rem, 4.5vw, 3.6rem);
    color: var(--red);
    font-weight: 700;
    z-index: 11;
    opacity: 0;
    transform: translateY(-50%) rotate(-8deg) scale(1.18);
    animation: hankoHit 520ms cubic-bezier(.16,1,.3,1) 720ms forwards;
  }

  .ch-loader .hanko::before {
    content: '';
    position: absolute;
    inset: 5px;
    border: 2px solid var(--red);
    border-radius: 2px;
    opacity: 0.4;
  }

  @keyframes hankoHit {
    0% { opacity: 0; transform: translateY(-50%) rotate(-8deg) scale(1.18); }
    100% { opacity: 0.62; transform: translateY(-50%) rotate(-8deg) scale(1); }
  }

  /* Bottom progress bar */
  .ch-loader .ldr-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: rgba(229,49,25,0.15);
    z-index: 10;
  }

  .ch-loader .ldr-progress-fill {
    height: 100%;
    background: var(--red);
    transform-origin: left;
    transform: scaleX(0);
    animation: barFill 1300ms cubic-bezier(.4,0,.2,1) 100ms forwards;
  }

  @keyframes barFill { to { transform: scaleX(1); } }

  /* Slash line */
  .ch-loader .slash-accent {
    position: absolute;
    top: -10%;
    left: 58%;
    width: 2px;
    height: 120%;
    background: var(--red);
    z-index: 4;
    transform: rotate(18deg) scaleY(0);
    transform-origin: top;
    animation: slashDraw 520ms cubic-bezier(.77,0,.18,1) 260ms forwards;
  }

  @keyframes slashDraw {
    to { transform: rotate(18deg) scaleY(1); opacity: 0.12; }
  }

  /* Dot burst */
  .ch-loader .dot-burst {
    position: absolute;
    width: 6px;
    height: 6px;
    background: var(--red);
    opacity: 0;
    z-index: 9;
  }

  .ch-loader .dot-burst.go {
    animation: dotExplode 620ms cubic-bezier(.2,.8,.2,1) forwards;
  }

  @keyframes dotExplode {
    0% { opacity: 1; transform: translate(0) scale(1.5); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
  }

  /* ── EXIT SEQUENCE ── */
  .ch-loader.exit {
    animation: loaderSilkOut 560ms cubic-bezier(.16,1,.3,1) forwards;
  }

  .ch-loader.exit .ldr-center {
    animation: exitCenter 460ms cubic-bezier(.77,0,.18,1) forwards;
  }

  .ch-loader.exit .hanko {
    animation: exitHanko 350ms cubic-bezier(.77,0,.18,1) forwards;
  }

  .ch-loader.exit .kanji-bg {
    animation: exitKanji 400ms cubic-bezier(.77,0,.18,1) forwards;
  }

  @keyframes exitCenter {
    to { opacity: 0; transform: translate(-50%, -50%) scale(0.92) translateY(12px); }
  }

  @keyframes exitHanko {
    to { opacity: 0; transform: translateY(-50%) rotate(-8deg) scale(1.18); }
  }

  @keyframes exitKanji {
    to { opacity: 0; transform: translate(-50%, -50%) scale(1.08); }
  }

  @keyframes loaderSilkOut {
    to { opacity: 0; transform: translateY(-14px); }
  }

  /* Aperture blades exit */
  .ch-loader .aperture {
    position: absolute;
    inset: 0;
    z-index: 120;
    opacity: 0;
    display: none;
    pointer-events: none;
    transition: opacity 90ms linear;
  }

  .ch-loader .aperture .blade {
    position: absolute;
    background: var(--ink);
    transition: transform 650ms cubic-bezier(.77,0,.18,1);
  }

  .ch-loader .aperture .blade--top { top: 0; left: 0; right: 0; height: 51%; }
  .ch-loader .aperture .blade--bot { bottom: 0; left: 0; right: 0; height: 51%; }
  .ch-loader .aperture .blade--left { top: 0; left: 0; bottom: 0; width: 51%; }
  .ch-loader .aperture .blade--right { top: 0; right: 0; bottom: 0; width: 51%; }

  .ch-loader.exit .aperture { opacity: 1; }
  .ch-loader.exit .aperture .blade--top { transform: translateY(-100%); }
  .ch-loader.exit .aperture .blade--bot { transform: translateY(100%); }
  .ch-loader.exit .aperture .blade--left { transform: translateX(-100%); }
  .ch-loader.exit .aperture .blade--right { transform: translateX(100%); }

  /* White flash */
  .ch-loader .exit-flash {
    position: absolute;
    inset: 0;
    background: var(--paper);
    opacity: 0;
    z-index: 200;
    display: none;
    pointer-events: none;
  }

  .ch-loader.exit .exit-flash {
    animation: whiteFlash 400ms ease 100ms forwards;
  }

  @keyframes whiteFlash {
    0% { opacity: 0; }
    35% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  /* Die */
  .ch-loader.die {
    display: none;
  }

  /* ── SHELL ── */
  .shell {
    width: min(1500px, calc(100vw - 28px));
    margin: 14px auto 64px;
    border: 2px solid var(--ink);
    background: var(--paper);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    isolation: isolate;
    opacity: 0;
    transform-origin: 50% 0;
    animation: chapterGateOpen 980ms cubic-bezier(.16,1,.3,1) 1260ms forwards;
  }

  .shell::before,
  .shell::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 80;
    pointer-events: none;
    opacity: 0;
  }

  .shell::before {
    background:
      linear-gradient(90deg, transparent 0 12%, rgba(229,49,25,0.72) 12% 12.26%, transparent 12.26% 100%),
      linear-gradient(0deg, rgba(242,234,219,0.74), rgba(229,49,25,0.08)),
      rgba(242,234,219,0.82);
    transform-origin: left;
    animation: chapterScanner 780ms cubic-bezier(.77,0,.18,1) 1320ms both;
  }

  .shell::after {
    background:
      linear-gradient(112deg, transparent 0 46%, rgba(229,49,25,0.26) 46.1% 46.8%, transparent 46.9% 100%),
      linear-gradient(90deg, rgba(242,234,219,0.42), rgba(242,234,219,0));
    mix-blend-mode: normal;
    animation: chapterSlashFlash 620ms cubic-bezier(.2,.8,.2,1) 1540ms both;
  }

  @keyframes chapterGateOpen {
    0% {
      opacity: 0;
      transform: translateY(26px) scale(0.985);
      clip-path: inset(8% 0 0 0);
      filter: saturate(0.86);
    }
    58% {
      opacity: 1;
      transform: translateY(-3px) scale(1.002);
      clip-path: inset(0 0 0 0);
      filter: saturate(1.03);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      clip-path: inset(0 0 0 0);
      filter: none;
    }
  }

  @keyframes chapterScanner {
    0% { opacity: 1; transform: translateX(-108%) skewX(-14deg); }
    44% { opacity: 0.78; transform: translateX(0) skewX(-14deg); }
    100% { opacity: 0; transform: translateX(112%) skewX(-14deg); }
  }

  @keyframes chapterSlashFlash {
    0% { opacity: 0; transform: translateX(-106%) skewX(-18deg); }
    44% { opacity: 0.72; transform: translateX(-2%) skewX(-18deg); }
    100% { opacity: 0; transform: translateX(106%) skewX(-18deg); }
  }

  /* ── NAV BAR ── */
  .chapter-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    min-height: 54px;
    animation: navSlide 620ms cubic-bezier(.16,1,.3,1) 1680ms both;
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }

  .chapter-nav::after {
    content: '学';
    position: absolute;
    right: 18px;
    top: 50%;
    z-index: 0;
    color: rgba(242,234,219,0.09);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 4.8rem;
    line-height: 1;
    transform: translateY(-50%) rotate(-8deg);
    pointer-events: none;
  }

  .chapter-nav > * {
    position: relative;
    z-index: 1;
  }

  @keyframes navSlide {
    from { opacity: 0; transform: translateY(-14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 24px;
    border: none;
    background: transparent;
    color: var(--paper);
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    cursor: pointer;
    transition: background 180ms;
  }

  .back-btn:hover { background: var(--red); }
  .back-btn::before { content: '\2190'; font-size: 1.2rem; }

  .nav-code {
    padding: 16px 24px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--paper-2);
  }

  /* ── HERO ── */
  .chapter-hero {
    display: grid;
    grid-template-columns: 1fr 320px;
    border-bottom: 2px solid var(--ink);
    animation: heroOpenPlate 820ms cubic-bezier(.16,1,.3,1) 1540ms both;
  }

  .hero-main {
    padding: clamp(32px, 6vw, 72px) clamp(32px, 6vw, 72px) clamp(32px, 6vw, 72px) clamp(58px, 7vw, 92px);
    border-right: 2px solid var(--ink);
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }

  .hero-main::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 5;
    background:
      linear-gradient(90deg, transparent 0 18%, rgba(229,49,25,0.62) 18% 18.38%, transparent 18.38% 100%),
      rgba(242,234,219,0.62);
    transform: translateX(-108%) skewX(-14deg);
    transform-origin: left;
    pointer-events: none;
    animation: heroInkWipe 680ms cubic-bezier(.77,0,.18,1) 1620ms both;
  }

  .hero-main > :not(.chapter-kanji-mark):not(.chapter-vertical-mark) {
    position: relative;
    z-index: 1;
  }

  .chapter-kanji-mark {
    position: absolute;
    right: clamp(12px, 5vw, 70px);
    top: clamp(16px, 4vw, 54px);
    z-index: 0;
    color: rgba(229,49,25,0.08);
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(13rem, 30vw, 26rem);
    line-height: 0.82;
    transform: rotate(-8deg);
    pointer-events: none;
    animation: chapterMarkFloat 6200ms cubic-bezier(.45,0,.2,1) infinite alternate;
  }

  @keyframes chapterMarkFloat {
    from { opacity: 0.72; transform: translate3d(0,0,0) rotate(-8deg) scale(1); }
    to { opacity: 1; transform: translate3d(-18px,-8px,0) rotate(-5deg) scale(1.035); }
  }

  .chapter-vertical-mark {
    position: absolute;
    left: clamp(10px, 2vw, 18px);
    top: clamp(26px, 5vw, 70px);
    bottom: clamp(26px, 5vw, 70px);
    z-index: 2;
    width: 34px;
    display: grid;
    place-items: center;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    border: 2px solid var(--ink);
    background: var(--paper-2);
    color: var(--red-dark);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.26em;
    box-shadow: 4px 4px 0 rgba(17,16,13,0.14);
    pointer-events: none;
  }

  @keyframes heroOpenPlate {
    0% { opacity: 0; transform: translateY(24px) scale(0.992); clip-path: inset(0 0 14% 0); }
    54% { opacity: 1; transform: translateY(-3px) scale(1.002); clip-path: inset(0 0 0 0); }
    100% { opacity: 1; transform: translateY(0) scale(1); clip-path: inset(0 0 0 0); }
  }

  @keyframes heroInkWipe {
    0% { opacity: 1; transform: translateX(-108%) skewX(-14deg); }
    45% { opacity: 0.78; transform: translateX(0) skewX(-14deg); }
    100% { opacity: 0; transform: translateX(112%) skewX(-14deg); }
  }

  .hero-code {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
    padding: 8px 14px;
    border: 2px solid var(--red);
    color: var(--red-dark);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    animation: fadeUp 560ms cubic-bezier(.2,.8,.2,1) 1840ms both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chapter-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4.8rem, 11vw, 12rem);
    font-weight: 400;
    line-height: 0.82;
    letter-spacing: -0.03em;
    text-shadow: 7px 7px 0 rgba(229,49,25,0.18);
    animation: titleReveal 760ms cubic-bezier(.16,1,.3,1) 1960ms both;
  }

  @keyframes titleReveal {
    from {
      opacity: 0;
      transform: translateY(70px);
      clip-path: inset(100% 0 0 0);
    }
    to {
      opacity: 1;
      transform: translateY(0);
      clip-path: inset(0 0 0 0);
    }
  }

  .chapter-desc {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 2px solid var(--ink);
    font-size: clamp(0.92rem, 1.3vw, 1.15rem);
    line-height: 1.7;
    color: #2f2a21;
    animation: fadeUp 580ms ease 2140ms both;
  }

  .chapter-warning {
    display: inline-block;
    margin-top: 14px;
    padding: 8px 14px;
    border: 2px solid var(--red);
    background: var(--red);
    color: var(--paper);
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    animation: warningStamp 520ms cubic-bezier(.16,1,.3,1) 2300ms both;
  }

  @keyframes warningStamp {
    0% { opacity: 0; transform: translateY(22px) scale(1.35) rotate(-2deg); }
    64% { opacity: 1; transform: translateY(0) scale(0.94) rotate(0.6deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
  }

  /* ── HERO SIDE ── */
  .hero-side {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    background: var(--paper-2);
    animation: sideLedgerOpen 700ms cubic-bezier(.16,1,.3,1) 1780ms both;
    position: relative;
    overflow: hidden;
  }

  .hero-side::after {
    content: '道';
    position: absolute;
    right: 14px;
    top: 14px;
    color: rgba(229,49,25,0.15);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5.2rem;
    line-height: 0.8;
    pointer-events: none;
  }

  .hero-side > * {
    position: relative;
    z-index: 1;
  }

  @keyframes sideLedgerOpen {
    from { opacity: 0; transform: translateX(46px); clip-path: inset(0 0 0 100%); }
    to { opacity: 1; transform: translateX(0); clip-path: inset(0 0 0 0); }
  }

  .meta-cell {
    padding: 18px 22px;
    border-bottom: 1px solid var(--ink);
    animation: metaSlide 500ms cubic-bezier(.2,.8,.2,1) both;
    transition: background 180ms ease, color 180ms ease, transform 220ms cubic-bezier(.16,1,.3,1);
  }

  .meta-cell:hover {
    background: var(--ink);
    color: var(--paper);
    transform: translateX(-5px);
  }

  .meta-cell:last-child { border-bottom: 0; }

  @keyframes metaSlide {
    from { opacity: 0; transform: translateX(24px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .meta-cell b {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    line-height: 0.88;
    color: var(--red);
    font-weight: 400;
  }

  .meta-cell span {
    font-size: 0.64rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
  }

  /* ── DEPS SECTION ── */
  .deps-section {
    border-bottom: 2px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    padding: clamp(24px, 4vw, 44px);
    position: relative;
    overflow: hidden;
  }

  .deps-section::after {
    content: '依存';
    position: absolute;
    right: clamp(12px, 3vw, 28px);
    top: 24px;
    writing-mode: vertical-rl;
    color: rgba(242,234,219,0.18);
    font-weight: 700;
    letter-spacing: 0.28em;
    pointer-events: none;
  }

  .deps-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 5vw, 4.2rem);
    font-weight: 400;
    line-height: 0.9;
    margin-bottom: 24px;
    animation: fadeUp 600ms ease 1100ms both;
  }

  .deps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 2px;
    background: var(--muted);
  }

  .dep-row {
    padding: 20px;
    background: var(--ink);
    animation: fadeUp 500ms ease both;
  }

  .dep-row strong {
    display: block;
    margin-bottom: 12px;
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--red);
  }

  .dep-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .dep-chip {
    display: inline-flex;
    padding: 7px 11px;
    border: 1px solid var(--paper-2);
    font-size: 0.74rem;
    font-weight: 500;
    color: var(--paper);
    animation: chipPop 400ms cubic-bezier(.2,.8,.2,1) both;
    transition: transform 180ms cubic-bezier(.16,1,.3,1), background 180ms ease, color 180ms ease;
  }

  .dep-chip:hover {
    background: var(--red);
    color: var(--paper);
    transform: translateY(-3px) rotate(-1deg);
  }

  @keyframes chipPop {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  /* ── NCERT FOCUS STRIP ── */
  .focus-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    border-bottom: 2px solid var(--ink);
  }

  .focus-cell {
    padding: 22px;
    border-right: 2px solid var(--ink);
    background: var(--paper-2);
    text-align: center;
    font-weight: 700;
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    animation: fadeUp 500ms ease both;
    transition: background 180ms ease, color 180ms ease, transform 220ms cubic-bezier(.16,1,.3,1), box-shadow 220ms ease;
  }

  .focus-cell:hover {
    background: var(--ink);
    color: var(--paper);
    transform: translate(-4px, -4px);
    box-shadow: 6px 6px 0 var(--red);
    z-index: 2;
    position: relative;
  }

  .focus-cell:last-child { border-right: 0; }

  .focus-cell::before {
    content: '';
    display: block;
    width: 10px;
    height: 10px;
    margin: 0 auto 10px;
    background: var(--red);
  }

  .section-strip {
    position: relative;
    min-height: 36px;
    display: flex;
    align-items: center;
    overflow: hidden;
    border-top: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    margin-top: -2px;
    background: var(--paper);
    color: var(--ink);
    isolation: isolate;
  }

  .section-strip::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    z-index: 2;
    width: 74px;
    background: linear-gradient(90deg, var(--red) 0 16px, var(--paper) 16px 18px, transparent 18px 100%);
    pointer-events: none;
  }

  .section-strip::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(90deg, rgba(17,16,13,0.16) 1px, transparent 1px) 0 0 / 34px 100%;
    opacity: 0.22;
    pointer-events: none;
  }

  .section-strip-track {
    position: relative;
    z-index: 1;
    display: flex;
    width: max-content;
    padding-left: 74px;
    white-space: nowrap;
    animation: sectionStripDrift 22s linear infinite;
  }

  .section-strip-track span {
    display: inline-flex;
    align-items: center;
    padding-right: 34px;
    font-size: 0.64rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--red-dark);
  }

  .section-strip-track span::before {
    content: '/';
    margin-right: 18px;
    color: var(--red);
  }

  .section-strip--ink {
    background: var(--ink);
    color: var(--paper);
  }

  .section-strip--ink::before {
    background: linear-gradient(90deg, var(--red) 0 16px, var(--paper) 16px 18px, transparent 18px 100%);
  }

  .section-strip--ink::after {
    background: linear-gradient(90deg, rgba(242,234,219,0.13) 1px, transparent 1px) 0 0 / 34px 100%;
  }

  .section-strip--ink .section-strip-track span {
    color: var(--paper-2);
  }

  .section-strip--red {
    background: var(--red);
    color: var(--paper);
  }

  .section-strip--red::before {
    background: linear-gradient(90deg, var(--ink) 0 16px, var(--paper) 16px 18px, transparent 18px 100%);
  }

  .section-strip--red::after {
    background: linear-gradient(90deg, rgba(242,234,219,0.18) 1px, transparent 1px) 0 0 / 34px 100%;
  }

  .section-strip--red .section-strip-track span,
  .section-strip--red .section-strip-track span::before {
    color: var(--paper);
  }

  @keyframes sectionStripDrift {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* ── TOPICS SECTION ── */
  .topics-section {
    padding: clamp(24px, 4vw, 52px);
    position: relative;
  }

  .topics-section::before {
    content: '学習';
    position: absolute;
    right: clamp(12px, 3vw, 28px);
    top: 28px;
    writing-mode: vertical-rl;
    padding: 9px 6px;
    border-left: 2px solid var(--red);
    background: rgba(242,234,219,0.72);
    color: rgba(157,27,13,0.56);
    font-size: 0.64rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    pointer-events: none;
  }

  .topics-header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 24px;
    margin-bottom: 38px;
    padding-bottom: 26px;
    border-bottom: 2px solid var(--ink);
    position: relative;
  }

  .topics-header::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 100%;
    height: 2px;
    background: var(--red);
    transform-origin: left;
    animation: lineDraw 800ms cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes lineDraw {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  .topics-header h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.8rem, 8vw, 8.5rem);
    font-weight: 400;
    line-height: 0.82;
    letter-spacing: -0.02em;
  }

  .topics-header .serif {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
  }

  .topics-counter {
    max-width: 320px;
    text-align: right;
    color: var(--muted);
    font-size: 0.82rem;
    line-height: 1.5;
  }

  .topics-counter b {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.4rem;
    line-height: 0.8;
    color: var(--red);
    font-weight: 400;
  }

  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 18px;
  }

  /* ── TOPIC CARD ── */
  .topic-card {
    border: 2px solid var(--ink);
    background: var(--paper);
    opacity: 0;
    transform: translateY(44px) scale(0.97);
    position: relative;
    overflow: hidden;
    transition: box-shadow 220ms ease, transform 220ms cubic-bezier(.16,1,.3,1), filter 220ms ease;
  }

  .topic-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(112deg, transparent 0 43%, rgba(229,49,25,0.72) 43.1% 44%, transparent 44.15% 100%);
    transform: translateX(-120%) skewX(-18deg);
    opacity: 0;
    pointer-events: none;
  }

  .topic-card.is-visible {
    animation: cardIn 700ms cubic-bezier(.2,.8,.2,1) forwards;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(44px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .topic-card:hover {
    transform: translate(-4px, -4px) !important;
    box-shadow: 8px 8px 0 var(--ink);
    z-index: 2;
    position: relative;
    filter: saturate(1.08) contrast(1.03);
  }

  .topic-card:hover::after {
    animation: topicBlade 560ms cubic-bezier(.77,0,.18,1) both;
  }

  @keyframes topicBlade {
    0% { opacity: 0; transform: translateX(-120%) skewX(-18deg); }
    25% { opacity: 0.95; }
    100% { opacity: 0; transform: translateX(120%) skewX(-18deg); }
  }

  .topic-head {
    display: grid;
    grid-template-columns: 60px 1fr;
    border-bottom: 2px solid var(--ink);
  }

  .topic-head b {
    display: grid;
    place-items: center;
    border-right: 2px solid var(--ink);
    background: var(--ink);
    color: var(--red);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    font-weight: 400;
    min-height: 60px;
  }

  .topic-head span {
    padding: 14px 18px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.7rem;
    line-height: 0.95;
    font-weight: 400;
    display: flex;
    align-items: center;
  }

  .topic-subs {
    list-style: none;
  }

  .topic-subs li {
    position: relative;
    padding: 13px 16px 13px 38px;
    border-top: 1px solid var(--line-soft);
    font-size: 0.82rem;
    line-height: 1.45;
    color: #2f2a21;
    opacity: 0;
    transform: translateX(-14px);
    transition: background 160ms;
  }

  .topic-subs li:first-child { border-top: 0; }

  .topic-card.is-visible .topic-subs li {
    animation: subSlide 420ms cubic-bezier(.2,.8,.2,1) forwards;
  }

  @keyframes subSlide {
    from { opacity: 0; transform: translateX(-14px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .topic-subs li::before {
    content: '';
    position: absolute;
    left: 14px;
    top: 19px;
    width: 8px;
    height: 8px;
    background: var(--red);
    transition: transform 180ms;
  }

  .topic-subs li:hover {
    background: var(--paper-2);
  }

  .topic-subs li:hover::before {
    transform: scale(1.4);
  }

  /* ── RECALL SECTION ── */
  .recall-section {
    border-top: 2px solid var(--ink);
    background: var(--paper-2);
    padding: clamp(24px, 4vw, 44px);
  }

  .recall-section h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.6rem, 5vw, 3.6rem);
    font-weight: 400;
    line-height: 0.9;
    margin-bottom: 22px;
  }

  .recall-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }

  .recall-item {
    padding: 22px;
    border: 2px solid var(--ink);
    background: var(--paper);
    font-size: 0.88rem;
    line-height: 1.6;
    color: #2f2a21;
    opacity: 0;
    transform: translateY(20px);
    transition: box-shadow 200ms, transform 200ms;
  }

  .recall-item.is-visible {
    animation: fadeUp 550ms cubic-bezier(.2,.8,.2,1) forwards;
  }

  .recall-item:hover {
    transform: translate(-3px, -3px) !important;
    box-shadow: 6px 6px 0 var(--ink);
  }

  .recall-item::before {
    content: '?';
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    margin-bottom: 12px;
    background: var(--red);
    color: var(--paper);
    font-weight: 700;
    font-size: 0.88rem;
  }

  .video-section {
    border-top: 2px solid var(--ink);
    background:
      linear-gradient(112deg, transparent 0 47%, rgba(229,49,25,0.14) 47.1% 47.5%, transparent 47.6% 100%) 0 0 / 220px 220px,
      var(--ink);
    color: var(--paper);
    padding: clamp(24px, 4vw, 52px);
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }

  .video-section::before {
    content: '映像';
    position: absolute;
    right: clamp(12px, 3vw, 28px);
    top: 24px;
    writing-mode: vertical-rl;
    color: rgba(242,234,219,0.16);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.32em;
    pointer-events: none;
  }

  .video-section::after {
    content: '';
    position: absolute;
    left: -10%;
    top: 42px;
    width: 120%;
    height: 2px;
    background: var(--red);
    opacity: 0.52;
    transform: rotate(-3deg);
    pointer-events: none;
  }

  .video-header {
    display: grid;
    grid-template-columns: 1fr minmax(220px, 320px);
    align-items: end;
    gap: 24px;
    margin-bottom: 26px;
    padding-bottom: 24px;
    border-bottom: 2px solid rgba(242,234,219,0.82);
    position: relative;
    z-index: 1;
  }

  .video-kicker {
    display: inline-flex;
    margin-bottom: 12px;
    padding: 8px 12px;
    border: 2px solid var(--red);
    color: var(--red);
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.18em;
  }

  .video-header h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.8rem, 8vw, 8rem);
    font-weight: 400;
    line-height: 0.82;
    letter-spacing: -0.02em;
  }

  .video-header .serif {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
  }

  .video-summary {
    border: 2px solid var(--paper);
    padding: 18px;
    background: rgba(242,234,219,0.06);
    font-size: 0.78rem;
    line-height: 1.55;
    color: var(--paper-2);
    text-align: right;
  }

  .video-summary b {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    color: var(--red);
    font-size: 4rem;
    font-weight: 400;
    line-height: 0.8;
  }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    position: relative;
    z-index: 1;
  }

  .video-card {
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 330px;
    border: 2px solid var(--paper);
    background: var(--paper);
    color: var(--ink);
    opacity: 0;
    transform: translateY(28px) skewY(0.5deg);
    transition: box-shadow 200ms, transform 200ms;
  }

  .video-card.is-visible {
    animation: fadeUp 560ms cubic-bezier(.2,.8,.2,1) var(--video-delay) forwards;
  }

  .video-card:hover {
    transform: translate(-4px, -4px) skewY(0deg) !important;
    box-shadow: 8px 8px 0 var(--red);
  }

  .video-card-head {
    display: grid;
    grid-template-columns: 64px 1fr;
    border-bottom: 2px solid var(--ink);
  }

  .video-rank {
    display: grid;
    place-items: center;
    border-right: 2px solid var(--ink);
    background: var(--red);
    color: var(--paper);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    font-weight: 400;
  }

  .video-label {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--red-dark);
  }

  .video-body {
    padding: 20px;
  }

  .video-body h4 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.7rem;
    font-weight: 400;
    line-height: 0.9;
    margin-bottom: 14px;
  }

  .video-body p {
    font-size: 0.82rem;
    line-height: 1.58;
    color: #2f2a21;
  }

  .video-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 16px;
  }

  .video-tags span {
    padding: 6px 8px;
    border: 1px solid var(--ink);
    background: var(--paper-2);
    font-size: 0.64rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .video-score {
    padding: 16px 20px 20px;
    border-top: 2px solid var(--ink);
  }

  .video-score-top {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 10px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .video-score-top b {
    color: var(--red-dark);
  }

  .video-stars {
    color: var(--line-soft);
    letter-spacing: 0.06em;
  }

  .video-stars .is-hot {
    color: var(--red);
  }

  .video-meter {
    height: 10px;
    border: 2px solid var(--ink);
    background: var(--paper-2);
    position: relative;
    overflow: hidden;
  }

  .video-meter::before {
    content: '';
    position: absolute;
    inset: 0;
    width: var(--score);
    background: var(--red);
  }

  .video-open {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-top: 14px;
    padding: 13px 14px;
    border: 2px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    transition: background 180ms, color 180ms;
  }

  .video-open::after {
    content: '\2197';
    color: var(--red);
    font-size: 1rem;
  }

  .video-open:hover {

    color: var(--paper);
  }

  .video-open:hover::after {

  }

  .topic-video-panel {
    margin-top: 18px;
    border: 2px solid var(--paper);
    background: rgba(242,234,219,0.06);

    z-index: 1;

  .topic-video-head {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 16px;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 2px solid var(--paper);
    color: var(--paper);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    line-height: 0.9;
    letter-spacing: 0.02em;
  }

  .topic-video-head span {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    color: var(--red);
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
  }

  .topic-search-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1px;
    background: rgba(242,234,219,0.42);
  }

  .topic-search-row {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 16px;
    background: var(--ink);
    color: var(--paper);
    transition: background 180ms, color 180ms;
  }

  .topic-search-row b {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border: 2px solid var(--red);
    color: var(--red);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    font-weight: 400;
  }

  .topic-search-row strong {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    font-weight: 400;
    line-height: 0.92;
  }

  .topic-search-row small {
    display: block;
    margin-top: 5px;
    color: var(--paper-2);
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .topic-search-row em {
    color: var(--red);
    font-style: normal;
    font-size: 1.1rem;
  }

  .topic-search-row:hover {
    background: var(--paper);
    color: var(--ink);
  }

  .topic-search-row:hover small {
    color: #2f2a21;
  }

  .chapter-tools,
  .study-lab {
    border-top: 2px solid var(--ink);
    background: var(--paper-2);
    padding: clamp(22px, 4vw, 44px);
  }

  .tool-grid,
  .study-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }

  .tool-card,
  .study-card,
  .dependency-alert {
    border: 2px solid var(--ink);
    background: var(--paper);
    padding: 20px;
    position: relative;
  }

  .tool-card h3,
  .study-card h3,
  .dependency-alert h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.6rem;
    font-weight: 400;
    line-height: 0.9;
    margin-bottom: 14px;
  }

  .dependency-alert {
    grid-column: 1 / -1;
    background: var(--ink);
    color: var(--paper);
  }

  .dependency-alert strong {
    color: var(--red);
  }

  .mastery-meter {
    height: 12px;
    border: 2px solid var(--ink);
    background: var(--paper-2);
    margin: 14px 0;
    overflow: hidden;
  }

  .mastery-meter span {
    display: block;
    height: 100%;
    width: var(--mastery);
    background: var(--red);
    transition: width 220ms;
  }

  .mastery-steps,
  .tool-actions,
  .drill-list,
  .mistake-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .mastery-steps button,
  .tool-actions button,
  .drill-item,
  .mistake-item button,
  .palette-result {
    border: 2px solid var(--ink);
    background: var(--paper);
    padding: 10px 12px;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.11em;
    cursor: pointer;
    transition: background 180ms, color 180ms;
  }

  .mastery-steps button[aria-pressed="true"],
  .tool-actions button[aria-pressed="true"],
  .drill-item[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
  }

  .tool-actions button:hover,
  .mastery-steps button:hover,
  .drill-item:hover,
  .palette-result:hover {
    background: var(--red);
    color: var(--paper);
  }

  .topic-card {
    cursor: pointer;
  }

  .topic-card.is-expanded {
    box-shadow: 8px 8px 0 var(--red);
  }

  .topic-extra {
    display: none;
    border-top: 2px solid var(--ink);
    background: var(--paper-2);
    padding: 16px;
  }

  .topic-card.is-expanded .topic-extra {
    display: grid;
    gap: 12px;
  }

  .topic-extra-row {
    border: 1px solid var(--ink);
    background: var(--paper);
    padding: 12px;
    font-size: 0.78rem;
    line-height: 1.55;
  }

  .topic-extra-row b {
    display: block;
    margin-bottom: 6px;
    color: var(--red-dark);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.66rem;
  }

  .topic-extra-row a {
    display: inline-flex;
    margin-top: 8px;
    border: 2px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    padding: 9px 11px;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .mistake-input {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    border: 2px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    padding: 14px;
    font: inherit;
    margin-bottom: 10px;
  }

  .mistake-item {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: start;
    width: 100%;
    border: 1px solid var(--ink);
    background: var(--paper);
    padding: 10px;
    font-size: 0.78rem;
    line-height: 1.45;
  }

  .exam-hud {
    display: none;
    position: sticky;
    top: 0;
    z-index: 25;
    grid-template-columns: 1fr auto auto;
    gap: 14px;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 2px solid var(--ink);
    background: var(--red);
    color: var(--paper);
  }

  .exam-hud button {
    border: 2px solid var(--paper);
    background: transparent;
    color: var(--paper);
    padding: 8px 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
  }

  .shell.exam-mode .exam-hud {
    display: grid;
  }

  .shell.exam-mode .chapter-desc,
  .shell.exam-mode .chapter-tools,
  .shell.exam-mode .deps-section,
  .shell.exam-mode .focus-strip,
  .shell.exam-mode .topics-section,
  .shell.exam-mode .video-section,
  .shell.exam-mode .study-lab,
  .shell.exam-mode .section-strip {
    display: none;
  }

  .command-palette {
    position: fixed;
    inset: 0;
    z-index: 9998;
    display: none;
    place-items: start center;
    padding-top: 8vh;
    background: rgba(17,16,13,0.86);
  }

  .command-palette.is-open {
    display: grid;
  }

  .palette-box {
    width: min(760px, calc(100vw - 28px));
    border: 2px solid var(--paper);
    background: var(--paper);
    box-shadow: 8px 8px 0 var(--red);
  }

  .palette-box input {
    width: 100%;
    border: 0;
    border-bottom: 2px solid var(--ink);
    background: var(--paper);
    padding: 18px;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
  }

  .palette-results {
    max-height: 56vh;
    overflow: auto;
    display: grid;
    gap: 1px;
    background: var(--ink);
  }

  .palette-result {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 14px;
    text-align: left;
    background: var(--paper);
  }

  .palette-result span {
    color: var(--red-dark);
  }

  .chapter-transition {
    position: fixed;
    inset: 0;
    z-index: 9997;
    pointer-events: none;
    display: grid;
    place-items: center;
    background:
      linear-gradient(90deg, rgba(229,49,25,0.1) 1px, transparent 1px) 0 0 / 34px 34px,
      var(--ink);
    color: var(--paper);
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(5rem, 16vw, 14rem);
    opacity: 0;
    transform: translateX(-100%) skewX(-14deg);
    overflow: hidden;
    text-shadow: 10px 10px 0 var(--red);
  }

  .chapter-transition::before,
  .chapter-transition::after {
    content: '';
    position: absolute;
    inset: -18% -28%;
    pointer-events: none;
    opacity: 0;
  }

  .chapter-transition::before {
    background:
      linear-gradient(112deg, transparent 0 42%, rgba(229,49,25,0.95) 42.2% 43.4%, transparent 43.6% 100%),
      linear-gradient(112deg, transparent 0 56%, rgba(242,234,219,0.35) 56.1% 61%, transparent 61.1% 100%);
    transform: translateX(-80%) skewX(-18deg);
  }

  .chapter-transition::after {
    background:
      radial-gradient(circle at 50% 50%, rgba(229,49,25,0.26), transparent 26%),
      repeating-linear-gradient(0deg, transparent 0 10px, rgba(242,234,219,0.055) 10px 11px);
    mix-blend-mode: screen;
  }

  .chapter-transition.is-active {
    animation: chapterExitSlash 760ms cubic-bezier(.77,0,.18,1) forwards;
  }

  .chapter-transition.is-active::before {
    animation: chapterExitBlade 760ms cubic-bezier(.77,0,.18,1) 80ms both;
  }

  .chapter-transition.is-active::after {
    animation: chapterExitBloom 760ms ease both;
  }

  @keyframes chapterExitSlash {
    0% { opacity: 0; transform: translateX(-100%) skewX(-14deg); }
    36% { opacity: 1; transform: translateX(0) skewX(-14deg); }
    100% { opacity: 1; transform: translateX(0) skewX(0); }
  }

  @keyframes chapterExitBlade {
    0% { opacity: 0; transform: translateX(-80%) skewX(-18deg); }
    40% { opacity: 1; }
    100% { opacity: 0.3; transform: translateX(38%) skewX(-18deg); }
  }

  @keyframes chapterExitBloom {
    0% { opacity: 0; transform: scale(0.94); }
    45% { opacity: 1; transform: scale(1.04); }
    100% { opacity: 0.38; transform: scale(1); }
  }

  /* ── CHAPTER NAV ── */
  .chapter-pager {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-top: 2px solid var(--ink);
  }

  .pager-link {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 24px;
    border: none;
    background: var(--paper);
    text-align: left;
    cursor: pointer;
    transition: background 180ms, color 180ms;
    border-right: 2px solid var(--ink);
  }

  .pager-link:last-child { border-right: 0; text-align: right; }

  .pager-link small {
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--red-dark);
  }

  .pager-link strong {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    font-weight: 400;
    line-height: 0.9;
  }

  .pager-link:hover {
    background: var(--ink);
    color: var(--paper);
  }

  .pager-link:hover small { color: var(--red); }

  .pager-link:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .pager-link:disabled:hover {
    background: var(--paper);
    color: var(--ink);
  }

  /* ── FOOTER ── */
  .chapter-footer {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 20px clamp(18px, 4vw, 44px);
    background: var(--red);
    color: var(--paper);
    border-top: 2px solid var(--ink);
  }

  .chapter-footer strong {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 2.2rem;
    line-height: 0.9;
  }

  .footer-back {
    border: 2px solid var(--paper);
    background: transparent;
    color: var(--paper);
    padding: 14px 24px;
    font-weight: 700;
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    cursor: pointer;
    transition: background 180ms, color 180ms;
  }

  .footer-back:hover {
    background: var(--paper);
    color: var(--red);
  }

  /* ── NOT FOUND ── */
  .not-found {
    padding: clamp(60px, 12vw, 140px) clamp(24px, 4vw, 44px);
    text-align: center;
  }

  .not-found h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4rem, 10vw, 10rem);
    font-weight: 400;
    line-height: 0.82;
    margin-bottom: 24px;
  }

  .not-found p {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .not-found a {
    display: inline-flex;
    padding: 16px 28px;
    border: 2px solid var(--ink);
    background: var(--red);
    color: var(--paper);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.82rem;
    transition: background 180ms;
  }

  .not-found a:hover { background: var(--ink); }

  /* ── RESPONSIVE ── */
  @media (max-width: 1060px) {
    .chapter-hero { grid-template-columns: 1fr; }
    .hero-main { border-right: 0; border-bottom: 2px solid var(--ink); }
    .hero-side { grid-template-rows: auto; grid-template-columns: repeat(3, 1fr); }
    .meta-cell { border-right: 1px solid var(--ink); }
    .meta-cell:nth-child(3n) { border-right: 0; }
    .topics-header { grid-template-columns: 1fr; }
    .topics-counter { text-align: left; }
  }

  @media (max-width: 760px) {
    .shell { width: calc(100vw - 18px); margin-top: 9px; box-shadow: 5px 5px 0 var(--ink); }
    .hero-main { padding-left: 52px; }
    .hero-side { grid-template-columns: repeat(2, 1fr); }
    .hero-side::after,
    .deps-section::after,
    .topics-section::before { display: none; }
    .meta-cell:nth-child(3n) { border-right: 1px solid var(--ink); }
    .meta-cell:nth-child(2n) { border-right: 0; }
    .topics-grid { grid-template-columns: 1fr; }
    .video-header { grid-template-columns: 1fr; }
    .video-summary { text-align: left; }
    .topic-search-row { grid-template-columns: 44px 1fr; }
    .topic-search-row em { display: none; }
    .section-strip { min-height: 30px; }
    .section-strip-track span { padding-right: 24px; font-size: 0.58rem; letter-spacing: 0.16em; }
    .chapter-title { font-size: clamp(3.2rem, 14vw, 5.5rem); }
    .chapter-footer { grid-template-columns: 1fr; gap: 16px; }
    .chapter-pager { grid-template-columns: 1fr; }
    .pager-link { border-right: 0 !important; border-bottom: 2px solid var(--ink); }
    .pager-link:last-child { border-bottom: 0; text-align: left; }
    .chapter-nav { flex-direction: column; align-items: flex-start; }
    .focus-strip { grid-template-columns: repeat(2, 1fr); }
    .focus-cell { border-bottom: 1px solid var(--ink); }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: 1ms !important;
    }

    body::after {
      opacity: 0;
    }

    .section-strip-track { animation: none; }
  }
</style>

    morphology: '形', anatomy: '解', 'animal-tissue': '組', cell: '胞', biomolecules: '分子',
    'cell-cycle': '周', inheritance: '遺', molecular: '鎖', photosynthesis: '光',
    'plant-respiration': '呼', 'plant-growth': '成', 'flower-reproduction': '花',
    breathing: '息', circulation: '血', excretion: '排', locomotion: '筋',
    neural: '神', chemical: '腺', 'human-reproduction': '産', 'reproductive-health': '健',
    'human-health': '免', microbes: '菌', evolution: '進', 'biotech-principles': '工',

  function buildLoader(chapter, idx) {
    const loader = document.getElementById('chLoader');
    const codeNum = chapter.code.split('-').pop() || '01';
    const kanji = KANJI_MAP[chapter.id] || SUBJECT_MARKS[chapter.subject] || '章';

    // Dot burst particles
    let dotsHTML = '';
    for (let i = 0; i < 16; i++) {
      const dx = (Math.random() - 0.5) * 500;
      const dy = (Math.random() - 0.5) * 500;
      dotsHTML += `<div class="dot-burst" style="--dx:${dx}px;--dy:${dy}px;left:50%;top:50%"></div>`;
    }

    loader.innerHTML = `
      <div class="ldr-grid"></div>
      <div class="kanji-bg">${kanji}</div>
      <div class="v-reveal"></div>
      <div class="h-wipe"></div>
      <div class="slash-accent"></div>
      <div class="scan-rail scan-rail--top"></div>
      <div class="scan-rail scan-rail--bot"></div>
      <div class="ldr-bracket ldr-bracket--tl"></div>
      <div class="ldr-bracket ldr-bracket--tr"></div>
      <div class="ldr-bracket ldr-bracket--bl"></div>
      <div class="ldr-bracket ldr-bracket--br"></div>
      <div class="jp-col jp-col-left">第${codeNum}章 - ${chapter.subjectLabel}</div>
      <div class="jp-col jp-col-right">${chapter.floorName} ─ FLOOR ${chapter.floor}</div>
      ${dotsHTML}
      <div class="ldr-center">
        <div class="ldr-code">${chapter.code} - Class ${chapter.class} - Floor ${chapter.floor}</div>
        <div class="ldr-num" data-n="${codeNum}">${codeNum}</div>
        <div class="ldr-title">${chapter.title}</div>
        <div class="ldr-floor">${chapter.floorName}</div>
      </div>
      <div class="hanko">${kanji}</div>
      <div class="ldr-progress"><div class="ldr-progress-fill"></div></div>
      <div class="aperture">
        <div class="blade blade--top"></div>
        <div class="blade blade--bot"></div>
        <div class="blade blade--left"></div>
        <div class="blade blade--right"></div>
      </div>
      <div class="exit-flash"></div>
    `;

    // Trigger the quiet particle lift.
    setTimeout(() => {
      loader.querySelectorAll('.dot-burst').forEach(d => d.classList.add('go'));
    }, 540);

    // Exit sequence
    setTimeout(() => {
      loader.classList.add('exit');
    }, 1380);

    // Remove loader
    setTimeout(() => {
      loader.classList.add('die');
    }, 1960);

    setTimeout(() => {
      loader.remove();
    }, 2200);
  }

  function youtubeSearchUrl(query) {
    return `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  }

  function videoStars(score) {
    const filled = Math.max(1, Math.min(5, Math.round(score / 20)));
    return Array.from({ length: 5 }, (_, i) => `<span${i < filled ? ' class="is-hot"' : ''}>★</span>`).join('');
  }

  function videoScore(chapter, mode) {
    const yieldBoost = chapter.yield === 'high' ? 4 : 0;
    const typeBoost = chapter.type === 'conceptual' ? 2 : 0;
    const scores = { ncert: 94, oneshot: 91, visual: 90, pyq: 92, vault: 88 };
    return Math.min(99, (scores[mode] || 88) + yieldBoost + typeBoost);
  }

  function chapterVideoCards(chapter) {
    const base = `${chapter.title} ${chapter.subjectLabel} Class ${chapter.class} NEET`;
    return [
      {
        label: 'Best first watch',
        title: 'NCERT Line-by-Line',
        query: `${base} NCERT line by line full chapter`,
        score: videoScore(chapter, 'ncert'),
        desc: `Full ${chapter.title} lectures that follow NCERT order before shortcuts.`,
        tags: ['NCERT', 'Full lecture', `Class ${chapter.class}`]
      },
      {
        label: 'Fast revision',
        title: 'One Shot Lectures',
        query: `${base} one shot lecture complete chapter`,
        score: videoScore(chapter, 'oneshot'),
        desc: `Rapid chapter coverage for revision days when you need the whole map fast.`,
        tags: ['One shot', 'Revision', chapter.yield]
      },
      {
        label: 'Visual mode',
        title: 'Diagrams + Animations',
        query: `${base} diagrams animation explanation`,
        score: videoScore(chapter, 'visual'),
        desc: `Animated explanations and diagram-first videos for processes, structures, and traps.`,
        tags: ['Animation', 'Diagrams', chapter.difficulty]
      },
      {
        label: 'Question mode',
        title: 'PYQ Practice',
        query: `${base} NEET PYQ questions solutions`,
        score: videoScore(chapter, 'pyq'),
        desc: `Past NEET question walkthroughs connected to the chapter logic.`,
        tags: ['PYQ', 'Practice', chapter.pyq]
      },
      {
        label: 'All available',
        title: 'Full YouTube Vault',
        query: base,
        score: videoScore(chapter, 'vault'),
        desc: `Open the complete live YouTube result wall for this chapter.`,
        tags: ['All results', 'Live search', chapter.subjectCode]
      }
    ];
  }

  function buildVideoSection(chapter, topics) {
    const cards = chapterVideoCards(chapter);

      const query = `${chapter.title} ${topic.title} ${chapter.subjectLabel} NEET`;

            <small>${topic.subs.slice(0, 3).join(' / ')}</small>

    }).join('');

    return `

            <span class="video-kicker">YouTube Resource Deck</span>

          </div>
          <div class="video-summary">

        <div class="video-grid">
          ${cards.map((card, i) => `
            <article class="video-card" style="--video-delay:${i * 90}ms">

              </div>
